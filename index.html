<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sec/resources — Cybersecurity Learning Index</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --font:
          "Pretendard Variable", pretendard, -apple-system, BlinkMacSystemFont,
          system-ui, Roboto, "Helvetica Neue", "Segoe UI", sans-serif;

        /* PASTEL CATEGORY COLORS */
        --c-ctf: #a8d8ea;
        --c-pwn: #ffb3ba;
        --c-web: #b5ead7;
        --c-crypto: #ffdac1;
        --c-re: #d4b8e0;
        --c-malware: #ffb3ba;
        --c-blue: #a2d2ff;
        --c-osint: #fde89a;
        --c-uni: #b5ead7;
        --c-blog: #a8d8ea;
        --c-cloud: #a2d2ff;
        --c-mobile: #d4b8e0;
        --c-archive: #d6d6d6;
      }

      [data-theme="dark"] {
        --bg: #13141a;
        --bg2: #1a1c24;
        --bg3: #20222d;
        --surface: #22242f;
        --surface2: #2a2d3a;
        --border: #2e3142;
        --border2: #383b52;
        --text: #e8eaf0;
        --text2: #a0a4b8;
        --text3: #666980;
        --shadow: rgba(0, 0, 0, 0.4);
        --glow: rgba(168, 216, 234, 0.08);
      }

      [data-theme="light"] {
        --bg: #f4f5f9;
        --bg2: #eceef5;
        --bg3: #e4e6ef;
        --surface: #ffffff;
        --surface2: #f8f9fc;
        --border: #dde0ed;
        --border2: #c8ccdf;
        --text: #1a1c2e;
        --text2: #4a4e6a;
        --text3: #8a8ea8;
        --shadow: rgba(0, 0, 0, 0.08);
        --glow: rgba(168, 216, 234, 0.15);
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        transition:
          background 0.3s,
          color 0.3s;
        line-height: 1.6;
      }

      /* ── HEADER ── */
      header {
        position: sticky;
        top: 0;
        z-index: 200;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .header-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 1.5rem;
        height: 60px;
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      .logo {
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--text);
        text-decoration: none;
        letter-spacing: -0.03em;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .logo-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c-ctf);
        display: inline-block;
      }

      .search-wrap {
        flex: 1;
        max-width: 380px;
        position: relative;
      }

      .search-wrap svg {
        position: absolute;
        left: 0.85rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text3);
        width: 15px;
        height: 15px;
      }

      .search-wrap input {
        width: 100%;
        background: var(--surface);
        border: 1.5px solid var(--border);
        color: var(--text);
        font-family: var(--font);
        font-size: 0.82rem;
        padding: 0.52rem 1rem 0.52rem 2.4rem;
        border-radius: 10px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .search-wrap input:focus {
        border-color: var(--c-ctf);
        box-shadow: 0 0 0 3px var(--glow);
      }

      .search-wrap input::placeholder {
        color: var(--text3);
      }

      .kbd {
        position: absolute;
        right: 0.7rem;
        top: 50%;
        transform: translateY(-50%);
        background: var(--bg3);
        border: 1px solid var(--border2);
        color: var(--text3);
        font-size: 0.6rem;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        font-family: var(--font);
      }

      /* THEME TOGGLE */
      .theme-toggle {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        border: 1.5px solid var(--border);
        background: var(--surface);
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        flex-shrink: 0;
      }

      .theme-toggle:hover {
        border-color: var(--border2);
        background: var(--surface2);
        color: var(--text);
      }

      /* STATS */
      .header-stats {
        display: flex;
        gap: 1.25rem;
        margin-left: auto;
      }

      .hstat {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0;
      }

      .hstat-num {
        font-size: 1rem;
        font-weight: 800;
        color: var(--text);
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      .hstat-label {
        font-size: 0.6rem;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      /* ── MAIN LAYOUT ── */
      .layout {
        max-width: 1280px;
        margin: 0 auto;
        padding: 1.5rem;
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 1.5rem;
        align-items: start;
      }

      /* ── SIDEBAR ── */
      .sidebar {
        position: sticky;
        top: 76px;
      }

      .sidebar-title {
        font-size: 0.65rem;
        font-weight: 700;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 0.6rem;
        padding: 0 0.5rem;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.52rem 0.75rem;
        border-radius: 10px;
        cursor: pointer;
        border: none;
        background: transparent;
        color: var(--text2);
        font-family: var(--font);
        font-size: 0.83rem;
        font-weight: 500;
        width: 100%;
        text-align: left;
        transition: all 0.15s;
        margin-bottom: 0.15rem;
      }

      .nav-item:hover {
        background: var(--surface);
        color: var(--text);
      }

      .nav-item.active {
        background: var(--surface2);
        color: var(--text);
        font-weight: 700;
      }

      .nav-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .nav-count {
        margin-left: auto;
        font-size: 0.68rem;
        color: var(--text3);
        font-weight: 500;
      }

      /* ── CONTENT AREA ── */
      .content-area {
        min-width: 0;
      }

      /* CATEGORY HEADER */
      .cat-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .cat-pill {
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.25rem 0.7rem;
        border-radius: 20px;
      }

      .cat-title {
        font-size: 1.05rem;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.02em;
      }

      .cat-sub {
        font-size: 0.75rem;
        color: var(--text3);
      }

      /* CARD GRID */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 0.75rem;
        margin-bottom: 2.5rem;
      }

      /* ── RESOURCE CARD ── */
      .card {
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 14px;
        padding: 1rem 1.1rem;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        overflow: hidden;
        cursor: pointer;
      }

      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 14px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 28px var(--shadow);
        border-color: var(--hover-color, var(--c-ctf));
      }

      .card:hover::after {
        opacity: 1;
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--hover-color, var(--c-ctf)) 6%, transparent),
          transparent 60%
        );
      }

      /* CARD TOP ROW */
      .card-top {
        display: flex;
        align-items: flex-start;
        gap: 0.65rem;
      }

      .card-icon {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        flex-shrink: 0;
        overflow: hidden;
        background: var(--bg3);
      }

      .card-icon img {
        width: 22px;
        height: 22px;
        object-fit: contain;
      }

      .card-icon-fallback {
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
      }

      .card-meta {
        flex: 1;
        min-width: 0;
      }

      .card-name {
        font-size: 0.88rem;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: -0.01em;
      }

      .card-url {
        font-size: 0.65rem;
        color: var(--text3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* STARS */
      .card-stars {
        display: flex;
        align-items: center;
        gap: 1px;
        margin-left: auto;
        flex-shrink: 0;
      }

      .star {
        font-size: 0.7rem;
        line-height: 1;
      }

      .star.filled {
        color: #fbbf24;
      }
      .star.empty {
        color: var(--border2);
      }

      /* CARD DESC */
      .card-desc {
        font-size: 0.74rem;
        color: var(--text2);
        line-height: 1.55;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* CARD FOOTER */
      .card-footer {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.1rem;
      }

      .card-tag {
        font-size: 0.62rem;
        font-weight: 600;
        padding: 0.18rem 0.55rem;
        border-radius: 20px;
        letter-spacing: 0.04em;
      }

      .card-difficulty {
        margin-left: auto;
        font-size: 0.65rem;
        color: var(--text3);
        font-weight: 500;
      }

      /* NO RESULTS */
      #no-results {
        display: none;
        text-align: center;
        padding: 5rem 2rem;
        color: var(--text3);
      }

      #no-results .nr-emoji {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
      }
      #no-results .nr-title {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text2);
        margin-bottom: 0.25rem;
      }
      #no-results .nr-sub {
        font-size: 0.75rem;
      }

      /* FOOTER */
      footer {
        text-align: center;
        padding: 2rem;
        font-size: 0.72rem;
        color: var(--text3);
        border-top: 1px solid var(--border);
      }

      footer span {
        color: var(--text2);
        font-weight: 600;
      }

      /* SCROLLBAR */
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 3px;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: static;
          display: flex;
          flex-wrap: wrap;
          gap: 0.4rem;
        }
        .sidebar-title {
          display: none;
        }
        .nav-item {
          width: auto;
          padding: 0.35rem 0.7rem;
          border-radius: 20px;
          background: var(--surface);
          font-size: 0.75rem;
        }
        .nav-item.active {
          background: var(--surface2);
        }
        .nav-count {
          display: none;
        }
        .header-stats {
          display: none;
        }
      }

      @media (max-width: 600px) {
        .header-inner {
          gap: 0.75rem;
        }
        .search-wrap {
          max-width: none;
          flex: 1;
        }
        .kbd {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a class="logo" href="#">
          <span class="logo-dot"></span>
          sec/resources
        </a>
        <div class="search-wrap">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input
            type="text"
            id="search"
            placeholder="Search resources..."
            autocomplete="off"
            spellcheck="false"
          />
          <span class="kbd">/</span>
        </div>
        <div class="header-stats">
          <div class="hstat">
            <span class="stat-num hstat-num" id="total-count">0</span
            ><span class="hstat-label">Total</span>
          </div>
          <div class="hstat">
            <span class="stat-num hstat-num" id="visible-count">0</span
            ><span class="hstat-label">Shown</span>
          </div>
        </div>
        <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
          <svg
            id="icon-sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            width="17"
            height="17"
            style="display: none"
          >
            <circle cx="12" cy="12" r="5" />
            <path
              d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
            />
          </svg>
          <svg
            id="icon-moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            width="17"
            height="17"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">Categories</div>
      </aside>
      <main class="content-area">
        <div id="content"></div>
        <div id="no-results">
          <div class="nr-emoji">🔍</div>
          <div class="nr-title">No results found</div>
          <div class="nr-sub">Try a different search term or category</div>
        </div>
      </main>
    </div>

    <footer>
      built by <span>divvkun</span> · cybersecurity resources index · 2025
    </footer>

    <script>
      // ── DATA ──────────────────────────────────────────────────────────────────────
      let DATA = {};

      // ── RENDER ────────────────────────────────────────────────────────────────────

      function stars(n) {
        let s = "";
        for (let i = 1; i <= 5; i++)
          s += `<span class="star ${i <= n ? "filled" : "empty"}">★</span>`;
        return s;
      }

      function favicon(url) {
  
        try {
    const h = new URL(url).hostname;
    return `https://www.google.com/s2/favicons?domain=${h}&sz=32`;
  } catch (e) {
    return "";
  }
}

      function hostname(url) {
        try {
          return new URL(url).hostname.replace("www.", "");
        } catch {
          return url;
        }
      }

      function colorAlpha(cssVar, alpha) {
        // Returns a light tinted bg using the color
        return cssVar;
      }

      const tagColors = {
        ctf: "var(--c-ctf)",
        pwn: "var(--c-pwn)",
        web: "var(--c-web)",
        crypto: "var(--c-crypto)",
        re: "var(--c-re)",
        malware: "var(--c-malware)",
        blue: "var(--c-blue)",
        osint: "var(--c-osint)",
        uni: "var(--c-uni)",
        blog: "var(--c-blog)",
        cloud: "var(--c-cloud)",
        mobile: "var(--c-mobile)",
        archive: "var(--c-archive)",
      };

      const diffColors = {
        Beginner: "#86efac",
        Mid: "#93c5fd",
        Hard: "#fca5a5",
        Expert: "#c4b5fd",
        All: "#d1d5db",
      };

      let allCards = [];
      let activeFilter = "all";
      let searchQuery = "";

      function buildPage() {
        const content = document.getElementById("content");
        const sidebar = document.getElementById("sidebar");
        let totalItems = 0;

        // Sidebar "All" button
        const allBtn = document.createElement("button");
        allBtn.className = "nav-item active";
        allBtn.dataset.filter = "all";
        const totalCount = Object.values(DATA).reduce(
          (a, s) => a + s.items.length,
          0,
        );
        allBtn.innerHTML = `<span class="nav-dot" style="background:#a0a4b8"></span>All<span class="nav-count">${totalCount}</span>`;
        sidebar.appendChild(allBtn);

        Object.entries(DATA).forEach(([sectionName, sd]) => {
          totalItems += sd.items.length;

          // Sidebar nav item
          const navBtn = document.createElement("button");
          navBtn.className = "nav-item";
          navBtn.dataset.filter = sd.tag;
          navBtn.dataset.section = sectionName;
          navBtn.innerHTML = `<span style="font-size:0.85rem">${sd.emoji}</span>${sectionName}<span class="nav-count">${sd.items.length}</span>`;
          sidebar.appendChild(navBtn);

          // Section
          const section = document.createElement("div");
          section.className = "section";
          section.dataset.section = sectionName.toLowerCase();
          section.dataset.tag = sd.tag;

          // Header
          const catHeader = document.createElement("div");
          catHeader.className = "cat-header";
          catHeader.innerHTML = `
      <span class="cat-pill" style="background:color-mix(in srgb,${sd.color} 18%,transparent);color:color-mix(in srgb,${sd.color} 80%,#333)">${sd.tag.toUpperCase()}</span>
      <span style="font-size:1.15rem">${sd.emoji}</span>
      <span class="cat-title">${sectionName}</span>
      <span class="cat-sub" style="margin-left:auto">${sd.items.length} resources</span>
    `;

          const grid = document.createElement("div");
          grid.className = "card-grid";

          sd.items.forEach((item) => {
            const card = document.createElement("a");
            card.className = "card";
            card.href = item.url;
            card.target = "_blank";
            card.rel = "noopener noreferrer";
            card.style.setProperty("--hover-color", sd.color);
            card.dataset.name = item.name.toLowerCase();
            card.dataset.desc = item.desc.toLowerCase();
            card.dataset.tag = sd.tag;
            card.dataset.section = sectionName.toLowerCase();

            const fav = favicon(item.url);
            const tagColor = sd.color;
            const dc = diffColors[item.diff] || "#d1d5db";

            card.innerHTML = `
        <div class="card-top">
          <div class="card-icon" style="background:color-mix(in srgb,${tagColor} 12%,var(--bg3))">
            <img src="${fav}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" loading="lazy">
            <div class="card-icon-fallback" style="display:none">${sd.emoji}</div>
          </div>
          <div class="card-meta">
            <div class="card-name">${item.name}</div>
            <div class="card-url">${hostname(item.url)}</div>
          </div>
          <div class="card-stars">${stars(item.stars)}</div>
        </div>
        <div class="card-desc">${item.desc}</div>
        <div class="card-footer">
          <span class="card-tag" style="background:color-mix(in srgb,${tagColor} 15%,transparent);color:color-mix(in srgb,${tagColor} 90%,#222)">${sd.tag}</span>
          <span class="card-difficulty" style="color:${dc}">${item.diff}</span>
        </div>
      `;

            allCards.push(card);
            grid.appendChild(card);
          });

          section.appendChild(catHeader);
          section.appendChild(grid);
          content.appendChild(section);
        });

        document.getElementById("total-count").textContent = totalItems;
        document.getElementById("visible-count").textContent = totalItems;

        // Sidebar click
        sidebar.addEventListener("click", (e) => {
          const btn = e.target.closest(".nav-item");
          if (!btn) return;
          sidebar
            .querySelectorAll(".nav-item")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          activeFilter = btn.dataset.filter;
          if (btn.dataset.section) {
            // scroll to section
            const sec = document.querySelector(
              `.section[data-section="${btn.dataset.section.toLowerCase()}"]`,
            );
            if (sec) {
              activeFilter = "all";
              applyFilters();
              setTimeout(
                () =>
                  sec.scrollIntoView({ behavior: "smooth", block: "start" }),
                50,
              );
              return;
            }
          }
          applyFilters();
        });
      }

      function applyFilters() {
        let visible = 0;
        const sections = document.querySelectorAll(".section");

        sections.forEach((section) => {
          let sv = 0;
          section.querySelectorAll(".card").forEach((card) => {
            const mf =
              activeFilter === "all" || card.dataset.tag === activeFilter;
            const ms =
              !searchQuery ||
              card.dataset.name.includes(searchQuery) ||
              card.dataset.desc.includes(searchQuery) ||
              card.dataset.section.includes(searchQuery);
            if (mf && ms) {
              card.style.display = "";
              sv++;
              visible++;
            } else card.style.display = "none";
          });
          section.style.display = sv === 0 ? "none" : "";
        });

        document.getElementById("visible-count").textContent = visible;
        document.getElementById("no-results").style.display =
          visible === 0 ? "block" : "none";
      }

      // Search
      document.getElementById("search").addEventListener("input", (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        applyFilters();
      });

      // Keyboard
      document.addEventListener("keydown", (e) => {
        if (
          e.key === "/" &&
          document.activeElement !== document.getElementById("search")
        ) {
          e.preventDefault();
          document.getElementById("search").focus();
        }
        if (e.key === "Escape") {
          document.getElementById("search").value = "";
          searchQuery = "";
          applyFilters();
        }
      });

      // Theme toggle
      const toggle = document.getElementById("theme-toggle");
      const sun = document.getElementById("icon-sun");
      const moon = document.getElementById("icon-moon");
      let theme = localStorage.getItem("theme") || "dark";

      function setTheme(t) {
        theme = t;
        document.documentElement.setAttribute("data-theme", t);
        localStorage.setItem("theme", t);
        if (t === "dark") {
          sun.style.display = "none";
          moon.style.display = "block";
        } else {
          sun.style.display = "block";
          moon.style.display = "none";
        }
      }

      setTheme(theme);
      toggle.addEventListener("click", () =>
        setTheme(theme === "dark" ? "light" : "dark"),
      );
      async function loadResources() {
  try {
    const response = await fetch("./resources.json");

    if (!response.ok) {
      throw new Error("Failed to load resources.json");
    }

    DATA = await response.json();

    buildPage();
  } catch (error) {
    console.error(error);

    document.body.innerHTML = `
      <div style="
        color:white;
        background:#111;
        padding:2rem;
        font-family:sans-serif;
      ">
        Failed to load resources.json
      </div>
    `;
  }
}

loadResources();
